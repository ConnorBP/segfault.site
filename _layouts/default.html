<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07080d">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-shell">
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Segfault home"><span>~/</span>segfault</a>
        <div class="nav-links">
          <a href="{{ '/#projects' | relative_url }}">Work</a>
          <a href="{{ '/#about' | relative_url }}">About</a>
          <a href="{{ '/#contact' | relative_url }}">Contact</a>
        </div>
        <span class="status"><i aria-hidden="true"></i>available</span>
      </nav>

      <main id="main-content">{{ content }}</main>

      <footer class="site-footer">
        <span>© {{ 'now' | date: '%Y' }} Connor Postma</span>
        <span class="footer-command">system.out.println("stay curious");</span>
      </footer>
    </div>
  </body>
</html>
